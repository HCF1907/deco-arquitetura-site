# Publicação do site da DECÔ no Netlify.
# Site estático, sem build. O publicar.sh monta a pasta pronta: os arquivos
# ficam na raiz do destino pra servir igual no Netlify e no GitHub Pages.
#
# O site foi publicado em 09/10/2026 por decisão do Felipe, ciente de que
# CAU, WhatsApp e as autorizações de foto ainda estavam pendentes.
# Ver site/PENDENTE.md.

[build]
  publish = "."
  command = ""

# A documentação interna tem nota de privacidade, suposição não confirmada e
# observação sobre o cliente. Ela não vai pro repositório de deploy, mas a
# regra fica como rede de segurança caso algum .md escorregue pra dentro.
[[redirects]]
  from = "/*.md"
  to = "/index.html"
  status = 404

# As imagens têm nome fixo e conteúdo estável — cache longo é seguro.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# O HTML precisa revalidar sempre, senão uma correção de texto demora a
# aparecer pra quem já visitou — e nessa fase o texto ainda vai mudar muito.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cabeçalhos de segurança básicos, no padrão dos outros sites da casa.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
